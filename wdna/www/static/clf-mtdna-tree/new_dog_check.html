<!DOCTYPE html>
<html>
<head>
    <title>Dog Mutations Checker</title>
    <link rel="stylesheet" href="data/layout.css">
    <style>
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input[type="text"] {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .result.success {
            background-color: #e8f5e9;
            border: 1px solid #4caf50;
            color: #2e7d32;
        }
        .result.error {
            background-color: #ffebee;
            border: 1px solid #ef5350;
            color: #c62828;
        }
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .help-text {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .navigation {
            margin-bottom: 20px;
        }
        .navigation a {
            color: #4CAF50;
            text-decoration: none;
        }
        .navigation a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <a href="index.html">← Back to main page</a>
        </div>
        <h1>Dog Mutations Checker</h1>
        <p>Enter mutations to check which haplogroup they belong to.</p>
        
        <div class="input-group">
            <label for="mutations">Mutations (comma separated):</label>
            <input type="text" id="mutations" placeholder="e.g., 2679.1G,6065,8368,9914.1GT">
            <p class="help-text">Reference mutations required: 2679.1G, 6065, 8368, 9914.1GT</p>
        </div>
        
        <button class="button" onclick="checkMutations()">Check Haplogroup</button>
        
        <div id="result" class="result"></div>
    </div>

    <script src="js/jquery/jquery-1.11.1.min.js"></script>
    <script src="js/d3.min.js"></script>
    <script src="js/haplogroup_finder.js"></script>
    <script>
        function checkMutations() {
            var mutationsInput = document.getElementById('mutations').value.trim();
            var resultDiv = document.getElementById('result');
            
            if (!mutationsInput) {
                showError('Please enter mutations');
                return;
            }
            
            // Parse mutations
            var mutations = parseMutations(mutationsInput);
            if (mutations.length === 0) {
                showError('Please enter valid mutations (comma-separated)');
                return;
            }
            
            // Validate mutations
            var validation = validateMutations(mutations);
            if (validation.invalid.length > 0) {
                showError('Invalid mutations detected: ' + validation.invalid.join(', ') + 
                         '\nPlease check the format (e.g., 1454, 3469, 10533T)');
                return;
            }
            
            // Use only valid mutations
            mutations = validation.valid;
            
            // Load tree data if not loaded
            if (!window.root) {
                d3.json("data/tree.json", function(error, json_tree) {
                    if (error) {
                        showError('Error loading tree data: ' + error);
                        return;
                    }
                    console.log("Loaded tree data:", json_tree);
                    window.root = json_tree[0];
                    window.finder = new HaplogroupFinder(window.root);
                    determineAndShowHaplogroup(mutations);
                });
            } else {
                console.log("Using existing tree data");
                if (!window.finder) {
                    console.log("Creating new finder");
                    window.finder = new HaplogroupFinder(window.root);
                }
                determineAndShowHaplogroup(mutations);
            }
        }

        function determineAndShowHaplogroup(mutations) {
            try {
                const result = window.finder.findHaplogroup(mutations);
                
                if (result) {
                    let message = 'These mutations belong to haplogroup: ' + result.name;
                    if (result.modifications && result.modifications.length > 0) {
                        message += '\nHaplogroup modifications: ' + result.modifications.join(', ');
                    }
                    showSuccess(message);
                } else {
                    showError('Could not determine haplogroup. Make sure your sample contains the reference mutations: 2679.1G, 6065, 8368, 9914.1GT');
                }
            } catch (error) {
                showError('Error determining haplogroup: ' + error.message);
            }
        }

        function showError(message) {
            var resultDiv = document.getElementById('result');
            resultDiv.className = 'result error';
            resultDiv.style.display = 'block';
            resultDiv.textContent = message;
        }

        function showSuccess(message) {
            var resultDiv = document.getElementById('result');
            resultDiv.className = 'result success';
            resultDiv.style.display = 'block';
            resultDiv.textContent = message;
        }
    </script>
</body>
</html>
